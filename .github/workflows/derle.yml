# Windows Setup.exe'yi otomatik derler.
# Çalıştırma: GitHub → Actions → "Setup derle" → Run workflow (sürüm numarasını yaz)
# ya da "v0.9.0" gibi bir etiket gönderince kendiliğinden çalışır.
name: Setup derle

on:
  workflow_dispatch:
    inputs:
      surum:
        description: "Sürüm (ör. 0.9.0)"
        required: true
        default: "0.9.0"
  push:
    tags: ["v*"]

env:
  PYTHONIOENCODING: utf-8
  PYTHONUTF8: "1"

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Sürüm numarası
        shell: pwsh
        run: |
          $v = "${{ github.event.inputs.surum }}"
          if (-not $v) { $v = "${{ github.ref_name }}".TrimStart("v") }
          "SURUM=$v" | Out-File -FilePath $env:GITHUB_ENV -Append
          $p = $v.Split(".")
          (Get-Content paketleme/surum_bilgisi_sablon.txt -Raw).Replace("{V1}",$p[0]).Replace("{V2}",$p[1]).Replace("{V3}",$p[2]).Replace("{VER}",$v) |
            Set-Content paketleme/surum_bilgisi.txt -Encoding utf8
          (Get-Content klipo_core/__init__.py -Raw) -replace '__version__ = ".*"', "__version__ = `"$v`"" | Set-Content klipo_core/__init__.py -Encoding utf8

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Kütüphaneler
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt "pyinstaller>=6.16"
          python -c "import numpy, PyInstaller; print('numpy', numpy.__version__, 'pyinstaller', PyInstaller.__version__)"

      - name: ffmpeg indir
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force bin | Out-Null
          Invoke-WebRequest https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg_tmp
          Get-ChildItem ffmpeg_tmp -Recurse -Include ffmpeg.exe,ffprobe.exe | Copy-Item -Destination bin
          bin\ffmpeg.exe -version | Select-Object -First 1

      - name: Testler
        run: |
          pip install pytest
          python -m pytest -q tests

      - name: Paketle (PyInstaller)
        run: pyinstaller paketleme/streamchisel.spec --noconfirm --distpath dist --workpath build

      - name: Paketlenmiş programı gerçek işlerle dene
        shell: pwsh
        run: |
          $env:KLIPO_NO_UI = "1"
          $p = Start-Process dist\Streamchisel\Streamchisel.exe -PassThru
          python paketleme/paket_testi.py
          $code = $LASTEXITCODE
          Stop-Process -Id $p.Id -Force
          Get-Content "$env:USERPROFILE\.streamchisel\streamchisel.log" -ErrorAction SilentlyContinue | Select-Object -First 80
          if ($code -ne 0) { exit 1 }

      - name: Kurulum sihirbazı (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; }
          & $iscc "/DSurum=$env:SURUM" paketleme\kurulum.iss
          $f = "dist\Streamchisel-Setup-$env:SURUM.exe"
          $h = (Get-FileHash $f -Algorithm SHA256).Hash.ToLower()
          "SHA-256: $h" | Tee-Object -FilePath "dist\Streamchisel-Setup-$env:SURUM.sha256.txt"
          "Boyut: {0:N0} MB" -f ((Get-Item $f).Length / 1MB)

      - uses: actions/upload-artifact@v4
        with:
          name: Streamchisel-Setup-${{ env.SURUM }}
          path: |
            dist/Streamchisel-Setup-*.exe
            dist/Streamchisel-Setup-*.sha256.txt
          retention-days: 30
